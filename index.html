<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PikVoice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7eef2;
      font-family: Arial, sans-serif;
    }
    .phone {
      width: 320px;
      height: 640px;
      background: #111;
      border-radius: 28px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    .screen {
      height: 100%;
      background: #fff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .label {
      margin: 0;
      padding: 10px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 24px;
      line-height: 1.2;
    }
    button.pik {
      flex: 0 0 70%;
      width: 100%;
      border: 0;
      padding: 8px;
      background: #fff;
      cursor: pointer;
    }
    button.pik img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <p class="label">Press Pik</p>
      <button class="pik" type="button" id="pik" aria-label="Press Pik">
        <img id="face" src="pik_blue.png" alt="Pik" />
      </button>
    </div>
  </div>
  <script>
    var colors = ["pik_blue.png", "pik_green.png", "pik_orange.png", "pik_purple.png"];
    var step = 0;
    var face = document.getElementById("face");
    var sound = new Audio("signal_short.mp3");
    document.getElementById("pik").addEventListener("click", function () {
      sound.currentTime = 0;
      sound.play();
      step = (step + 1) % colors.length;
      face.src = colors[step];
    });
  </script>
</body>
</html>
